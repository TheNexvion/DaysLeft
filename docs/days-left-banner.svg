<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Days Left — Never Miss A Date</title>
  <desc id="desc">A clean Android countdown app for tracking important dates offline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8FE"/>
      <stop offset="1" stop-color="#EBF0FF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1600" height="700" rx="36" fill="url(#bg)"/>
  <circle cx="1430" cy="80" r="190" fill="#2D52C8" opacity=".08"/>
  <circle cx="150" cy="650" r="230" fill="#2D52C8" opacity=".06"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="110" y="180" font-size="34" font-weight="700" fill="#2D52C8">ANDROID APP</text>
    <text x="110" y="275" font-size="76" font-weight="800" fill="#1B1B1F">Days Left</text>
    <text x="110" y="355" font-size="76" font-weight="800" fill="#2D52C8">Never Miss A Date</text>
    <text x="110" y="420" font-size="28" fill="#5B5E68">Simple • Offline • Private • Reliable reminders</text>
    <rect x="110" y="475" width="245" height="64" rx="32" fill="#2D52C8"/>
    <text x="232" y="517" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">Kotlin + Compose</text>
    <g filter="url(#shadow)">
      <rect x="1040" y="78" width="330" height="544" rx="42" fill="#FFFFFF" stroke="#DDE3F5" stroke-width="4"/>
      <rect x="1070" y="130" width="270" height="105" rx="24" fill="#EBF0FF"/>
      <text x="1092" y="169" font-size="20" font-weight="700" fill="#5B5E68">NEXT EVENT</text>
      <text x="1092" y="210" font-size="34" font-weight="800" fill="#1B1B1F">Birthday</text>
      <text x="1092" y="270" font-size="74" font-weight="800" fill="#2D52C8">128</text>
      <text x="1092" y="302" font-size="20" fill="#5B5E68">days remaining</text>
      <rect x="1070" y="335" width="270" height="2" fill="#EBF0FF"/>
      <text x="1092" y="382" font-size="20" font-weight="700" fill="#1B1B1F">Trip</text>
      <text x="1092" y="420" font-size="42" font-weight="800" fill="#2D52C8">214</text>
      <text x="1092" y="451" font-size="18" fill="#5B5E68">days remaining</text>
      <rect x="1092" y="492" width="226" height="54" rx="27" fill="#2D52C8"/>
      <text x="1205" y="527" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">+ Add Event</text>
    </g>
  </g>
</svg>
